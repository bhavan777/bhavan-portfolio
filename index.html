<!doctype html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8"/>
    <meta name="viewport" content="width=device-width,initial-scale=1.0"/>
    <meta name="description" content="Bhavan Kuchibhotla — Staff and founding frontend lead. 0→1 twice, teams 3→18. Bengaluru. In-office, hybrid, or remote."/>
    <meta name="theme-color" content="#0b0b0a"/>
    <meta name="color-scheme" content="dark light"/>
    <title>Bhavan Kuchibhotla — Staff Frontend</title>
    <link rel="preconnect" href="https://fonts.googleapis.com"/>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin/>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' fill='%230b0b0a'/%3E%3Ctext x='16' y='21' text-anchor='middle' font-family='Georgia,serif' font-size='13' fill='%23e3943a'%3EB/%3C/text%3E%3C/svg%3E"/>
    <script>
      (() => {
        const theme = (() => {
          try {
            const stored = localStorage.getItem('theme');
            if (stored === 'light' || stored === 'dark') return stored;
          } catch {}
          return 'dark';
        })();
        document.documentElement.setAttribute('data-theme', theme);
        document.documentElement.style.colorScheme = theme;
        const meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute('content', theme === 'dark' ? '#0b0b0a' : '#f3f0e9');
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
